defaults:
  - _self_
  - launcher: local

hydra:
  job:
    chdir: false

# output
output: .stable_worldmodel/datasets/
output_name: tracking_teleop

# collect
num_envs: 1 #must be 1 for teleop
episodes: 20
seed: 42
  
# collect policy
policy:
  _target_: cloudgripper_wm.policies.keyboard_teleop.KeyboardTeleopPolicy
  step_size: 0.02
  max_delta: 0.05

# live visualization
visualization:
  enabled: true
  show_left_ui: false
  show_right_ui: false

# world
world:
  image_shape: [224, 224]
  height: 224
  width: 224
  max_episode_steps: 60 # smaller episodes for teleop
  max_delta: 0.05   


defaults:
  - _self_
  - launcher: local

hydra:
  job:
    chdir: false

# output
output: .stable_worldmodel/datasets/
output_name: tracking

# collect
num_envs: 10
episodes: 200
seed: 42
  
# collect policy
policy:
  _target_: cloudgripper_wm.policies.StickyRandomPolicy
  min_repeat: 2
  max_repeat: 5
  noise_std: 0.1

# world
world:
  image_shape: [224, 224]
  height: 224
  width: 224
  max_episode_steps: 250
  max_delta: 0.05   

